<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Social Media App v0.2 Test</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0F1115;
      --panel: #1A1D24;
      --panel-soft: #232733;
      --line: rgba(255, 255, 255, 0.1);
      --text: #f5f7fb;
      --muted: #a2a8b4;
      --accent: #D4AF37;
      --accent-2: #b98d24;
      --danger: #ff6b7a;
      --shadow: 0 18px 46px rgba(0, 0, 0, 0.32);
      --radius: 8px;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      background: var(--bg);
    }

    body {
      min-height: 100%;
      margin: 0;
      color: var(--text);
      background: linear-gradient(180deg, #0F1115 0%, #151821 100%);
      letter-spacing: 0;
    }

    button,
    input,
    textarea,
    select {
      font: inherit;
    }

    button {
      border: 0;
      cursor: pointer;
    }

    .app {
      width: min(100%, 760px);
      min-height: 100svh;
      margin: 0 auto;
      padding: max(18px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 8px 0 18px;
    }

    h1,
    h2,
    h3,
    p {
      margin: 0;
    }

    h1 {
      font-size: 1.35rem;
      line-height: 1.12;
    }

    .subline {
      margin-top: 5px;
      color: var(--muted);
      font-size: 0.9rem;
    }

    .save-pill {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      min-height: 36px;
      padding: 0 10px;
      color: var(--muted);
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--line);
      border-radius: 999px;
      white-space: nowrap;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
    }

    .tabs {
      position: sticky;
      top: 0;
      z-index: 10;
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 8px;
      padding: 8px 0 14px;
      background: linear-gradient(180deg, rgba(15, 17, 21, 0.96), rgba(15, 17, 21, 0.72));
      backdrop-filter: blur(16px);
    }

    .tab {
      min-height: 42px;
      color: var(--muted);
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      font-weight: 750;
      font-size: 0.82rem;
    }

    .tab.active {
      color: #15110a;
      background: var(--accent);
      border-color: transparent;
    }

    .view {
      display: none;
      padding-top: 4px;
    }

    .view.active {
      display: block;
    }

    .grid {
      display: grid;
      gap: 12px;
    }

    .stats {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .stat,
    .panel,
    .idea {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    .stat {
      min-height: 112px;
      padding: 16px;
    }

    .stat strong {
      display: block;
      margin-bottom: 4px;
      font-size: 1.85rem;
      line-height: 1;
    }

    .stat span {
      color: var(--muted);
      font-size: 0.86rem;
    }

    .stat small {
      display: block;
      margin-top: 8px;
      color: #d8c582;
      font-size: 0.78rem;
      line-height: 1.3;
      overflow-wrap: anywhere;
    }

    .panel {
      margin-top: 12px;
      padding: 14px;
    }

    .panel h2 {
      margin-bottom: 12px;
      font-size: 1rem;
    }

    .form {
      display: grid;
      gap: 10px;
    }

    label {
      display: grid;
      gap: 6px;
      color: var(--muted);
      font-size: 0.78rem;
      font-weight: 750;
      text-transform: uppercase;
    }

    input,
    textarea,
    select {
      width: 100%;
      min-height: 44px;
      padding: 11px 12px;
      color: var(--text);
      background: #11141b;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      outline: none;
    }

    textarea {
      min-height: 92px;
      resize: vertical;
    }

    input:focus,
    textarea:focus,
    select:focus {
      border-color: rgba(212, 175, 55, 0.75);
      box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.14);
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .primary {
      min-height: 48px;
      color: #15110a;
      background: var(--accent);
      border-radius: var(--radius);
      font-weight: 850;
    }

    .secondary {
      min-height: 40px;
      color: var(--text);
      background: var(--panel-soft);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      font-weight: 750;
    }

    .danger {
      color: var(--danger);
    }

    .filters {
      display: flex;
      gap: 8px;
      margin: 12px 0;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .filters::-webkit-scrollbar {
      display: none;
    }

    .chip {
      flex: 0 0 auto;
      min-height: 36px;
      padding: 0 11px;
      color: var(--muted);
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--line);
      border-radius: 999px;
      font-weight: 750;
    }

    .chip.active {
      color: #15110a;
      background: var(--accent-2);
      border-color: transparent;
    }

    .list {
      display: grid;
      gap: 10px;
      padding-bottom: 24px;
    }

    .idea {
      padding: 13px;
    }

    .idea-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
    }

    .idea h3 {
      font-size: 1rem;
      line-height: 1.25;
      overflow-wrap: anywhere;
    }

    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin: 9px 0;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      min-height: 26px;
      padding: 0 8px;
      color: var(--muted);
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--line);
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 760;
    }

    .badge.status {
      color: #15110a;
      background: var(--accent);
      border-color: transparent;
    }

    .notes {
      color: #d8dee9;
      font-size: 0.92rem;
      line-height: 1.45;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 12px;
    }

    .empty {
      padding: 28px 16px;
      color: var(--muted);
      text-align: center;
      background: rgba(255, 255, 255, 0.04);
      border: 1px dashed rgba(255, 255, 255, 0.18);
      border-radius: var(--radius);
    }

    .metric-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
      margin-top: 12px;
    }

    .metric {
      min-height: 58px;
      padding: 10px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--line);
      border-radius: var(--radius);
    }

    .metric strong,
    .metric span {
      display: block;
    }

    .metric strong {
      font-size: 1rem;
    }

    .metric span {
      margin-top: 4px;
      color: var(--muted);
      font-size: 0.76rem;
    }

    @media (min-width: 720px) {
      .app {
        padding-inline: 24px;
      }

      .stats {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }

      .content-grid {
        display: grid;
        grid-template-columns: 330px 1fr;
        gap: 14px;
        align-items: start;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <div>
        <h1>Social Studio</h1>
        <p class="subline">Ideen, Reels und Uploads lokal planen.</p>
      </div>
      <div class="save-pill" aria-label="Lokale Speicherung aktiv">
        <span class="dot"></span>
        Lokal
      </div>
    </header>

    <nav class="tabs" aria-label="Hauptbereiche">
      <button class="tab active" data-view="dashboard" type="button">Dashboard</button>
      <button class="tab" data-view="ideas" type="button">Ideen</button>
      <button class="tab" data-view="planner" type="button">Planer</button>
      <button class="tab" data-view="analytics" type="button">Stats</button>
    </nav>

    <section id="dashboard" class="view active">
      <div class="grid stats" id="stats"></div>
      <div class="panel">
        <h2>Naechste Reels</h2>
        <div class="list" id="nextReels"></div>
      </div>
    </section>

    <section id="ideas" class="view">
      <div class="content-grid">
        <form class="panel form" id="ideaForm">
          <h2>Neue Idee</h2>
          <label>
            Titel
            <input id="title" autocomplete="off" maxlength="90" required placeholder="Hook oder Thema">
          </label>
          <label>
            Notizen
            <textarea id="notes" maxlength="600" placeholder="Script, Shotlist, CTA"></textarea>
          </label>
          <div class="row">
            <label>
              Kategorie
              <select id="category">
                <option>Fitness</option>
                <option>Food</option>
                <option>Behind the Scenes</option>
                <option>Education</option>
                <option>Personal</option>
              </select>
            </label>
            <label>
              Status
              <select id="status">
                <option>Idee</option>
                <option>Gefilmt</option>
                <option>Geschnitten</option>
                <option>Hochgeladen</option>
              </select>
            </label>
          </div>
          <label>
            Geplantes Datum
            <input id="date" type="date">
          </label>
          <button class="primary" type="submit">Speichern</button>
        </form>

        <div>
          <div class="filters" id="filters"></div>
          <div class="list" id="ideaList"></div>
        </div>
      </div>
    </section>

    <section id="planner" class="view">
      <div class="filters" id="statusFilters"></div>
      <div class="list" id="plannerList"></div>
    </section>

    <section id="analytics" class="view">
      <div class="content-grid">
        <form class="panel form" id="statsForm">
          <h2>Reel-Statistik</h2>
          <label>
            Titel
            <input id="statsTitle" autocomplete="off" maxlength="90" required placeholder="Veröffentlichtes Reel">
          </label>
          <div class="row">
            <label>
              Datum
              <input id="statsDate" type="date" required>
            </label>
            <label>
              Kategorie
              <select id="statsCategory">
                <option>Fitness</option>
                <option>Food</option>
                <option>Behind the Scenes</option>
                <option>Education</option>
                <option>Personal</option>
              </select>
            </label>
          </div>
          <div class="row">
            <label>
              Hook
              <input id="statsHook" autocomplete="off" maxlength="120" placeholder="Erste 2 Sekunden">
            </label>
            <label>
              Song
              <input id="statsSong" autocomplete="off" maxlength="90" placeholder="Audio / Trend">
            </label>
          </div>
          <div class="row">
            <label>
              Views
              <input id="statsViews" type="number" min="0" inputmode="numeric" value="0">
            </label>
            <label>
              Likes
              <input id="statsLikes" type="number" min="0" inputmode="numeric" value="0">
            </label>
          </div>
          <div class="row">
            <label>
              Kommentare
              <input id="statsComments" type="number" min="0" inputmode="numeric" value="0">
            </label>
            <label>
              Saves
              <input id="statsSaves" type="number" min="0" inputmode="numeric" value="0">
            </label>
          </div>
          <div class="row">
            <label>
              Shares
              <input id="statsShares" type="number" min="0" inputmode="numeric" value="0">
            </label>
            <label>
              Followergewinn
              <input id="statsFollowers" type="number" min="0" inputmode="numeric" value="0">
            </label>
          </div>
          <label>
            Warum lief es gut/schlecht?
            <textarea id="statsNote" maxlength="700" placeholder="Hook, Thema, Timing, Schnitt, CTA"></textarea>
          </label>
          <button class="primary" type="submit">Statistik speichern</button>
        </form>

        <div>
          <div class="list" id="statsList"></div>
        </div>
      </div>
    </section>
  </main>

  <script>
    const STORAGE_KEY = "social-media-app-v0_2";
    const LEGACY_STORAGE_KEY = "social-media-app-v0_1";
    const statuses = ["Idee", "Gefilmt", "Geschnitten", "Hochgeladen"];
    const categories = ["Alle", "Fitness", "Food", "Behind the Scenes", "Education", "Personal"];
    let activeCategory = "Alle";
    let activeStatus = "Alle";
    let state = loadState();
    let items = state.items;
    let reelStats = state.reelStats;

    const els = {
      tabs: document.querySelectorAll(".tab"),
      views: document.querySelectorAll(".view"),
      form: document.getElementById("ideaForm"),
      statsForm: document.getElementById("statsForm"),
      title: document.getElementById("title"),
      notes: document.getElementById("notes"),
      category: document.getElementById("category"),
      status: document.getElementById("status"),
      date: document.getElementById("date"),
      statsTitle: document.getElementById("statsTitle"),
      statsDate: document.getElementById("statsDate"),
      statsCategory: document.getElementById("statsCategory"),
      statsHook: document.getElementById("statsHook"),
      statsSong: document.getElementById("statsSong"),
      statsViews: document.getElementById("statsViews"),
      statsLikes: document.getElementById("statsLikes"),
      statsComments: document.getElementById("statsComments"),
      statsSaves: document.getElementById("statsSaves"),
      statsShares: document.getElementById("statsShares"),
      statsFollowers: document.getElementById("statsFollowers"),
      statsNote: document.getElementById("statsNote"),
      stats: document.getElementById("stats"),
      filters: document.getElementById("filters"),
      statusFilters: document.getElementById("statusFilters"),
      ideaList: document.getElementById("ideaList"),
      plannerList: document.getElementById("plannerList"),
      nextReels: document.getElementById("nextReels"),
      statsList: document.getElementById("statsList")
    };

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          return normalizeState(JSON.parse(raw));
        }
        const legacyRaw = localStorage.getItem(LEGACY_STORAGE_KEY);
        if (legacyRaw) {
          const legacyItems = JSON.parse(legacyRaw);
          const normalizedItems = Array.isArray(legacyItems) ? legacyItems.map(normalizeItem) : seedItems();
          return {
            items: normalizedItems,
            reelStats: normalizedItems
              .filter((item) => item.status === "Hochgeladen")
              .map(statsFromItem)
          };
        }
        return { items: seedItems(), reelStats: seedReelStats() };
      } catch (error) {
        return { items: seedItems(), reelStats: seedReelStats() };
      }
    }

    function normalizeState(value) {
      if (Array.isArray(value)) {
        return { items: value.map(normalizeItem), reelStats: [] };
      }
      return {
        items: Array.isArray(value.items) ? value.items.map(normalizeItem) : seedItems(),
        reelStats: Array.isArray(value.reelStats) ? value.reelStats.map(normalizeStats) : []
      };
    }

    function normalizeItem(item) {
      return {
        id: item.id || crypto.randomUUID(),
        title: item.title || "Unbenannte Idee",
        notes: item.notes || "",
        category: item.category || "Fitness",
        status: statuses.includes(item.status) ? item.status : "Idee",
        date: item.date || "",
        createdAt: item.createdAt || Date.now()
      };
    }

    function seedItems() {
      return [
        {
          id: crypto.randomUUID(),
          title: "3 Fehler beim Meal Prep",
          notes: "Kurzer Hook, drei schnelle Beispiele, am Ende Speicher-CTA.",
          category: "Food",
          status: "Idee",
          date: todayPlus(1),
          createdAt: Date.now()
        },
        {
          id: crypto.randomUUID(),
          title: "Gym Tasche packen als Reel",
          notes: "Schnelle Schnitte, jedes Item als Beat.",
          category: "Fitness",
          status: "Gefilmt",
          date: todayPlus(3),
          createdAt: Date.now() - 2000
        }
      ];
    }

    function seedReelStats() {
      return [
        {
          id: crypto.randomUUID(),
          title: "Protein-Fruehstueck in 30 Sekunden",
          date: todayPlus(-2),
          category: "Food",
          hook: "Das esse ich, wenn ich keine Zeit habe.",
          song: "Clean beat",
          views: 12800,
          likes: 820,
          comments: 34,
          saves: 176,
          shares: 58,
          followers: 42,
          note: "Klare Hook, schneller Schnitt und direkt nutzbarer Mehrwert.",
          createdAt: Date.now() - 5000
        }
      ];
    }

    function statsFromItem(item) {
      return {
        id: crypto.randomUUID(),
        title: item.title,
        date: item.date || "",
        category: item.category || "Fitness",
        hook: item.notes || "",
        song: "",
        views: 0,
        likes: 0,
        comments: 0,
        saves: 0,
        shares: 0,
        followers: 0,
        note: "Aus v0.1 uebernommen. Performance-Werte bitte nachtragen.",
        createdAt: Date.now()
      };
    }

    function normalizeStats(stat) {
      return {
        id: stat.id || crypto.randomUUID(),
        title: stat.title || "Unbenanntes Reel",
        date: stat.date || "",
        category: stat.category || "Fitness",
        hook: stat.hook || "",
        song: stat.song || "",
        views: toNumber(stat.views),
        likes: toNumber(stat.likes),
        comments: toNumber(stat.comments),
        saves: toNumber(stat.saves),
        shares: toNumber(stat.shares),
        followers: toNumber(stat.followers),
        note: stat.note || "",
        createdAt: stat.createdAt || Date.now()
      };
    }

    function todayPlus(days) {
      const date = new Date();
      date.setDate(date.getDate() + days);
      return date.toISOString().slice(0, 10);
    }

    function persist() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({ items, reelStats }));
      render();
    }

    function setView(viewName) {
      els.tabs.forEach((tab) => tab.classList.toggle("active", tab.dataset.view === viewName));
      els.views.forEach((view) => view.classList.toggle("active", view.id === viewName));
    }

    function renderChips(container, values, active, onPick) {
      container.innerHTML = "";
      values.forEach((value) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "chip" + (value === active ? " active" : "");
        button.textContent = value;
        button.addEventListener("click", () => onPick(value));
        container.appendChild(button);
      });
    }

    function renderStats() {
      const topReel = bestReel();
      const stats = [
        { label: "Gesamt", value: items.length, detail: "Ideen und geplante Reels" },
        { label: "Ideen", value: countStatus("Idee"), detail: "Noch offen" },
        { label: "In Arbeit", value: countStatus("Gefilmt") + countStatus("Geschnitten"), detail: "Gefilmt oder im Schnitt" },
        { label: "Online", value: countStatus("Hochgeladen"), detail: "Hochgeladen im Planer" },
        { label: "Gesamtviews", value: formatNumber(sumMetric("views")), detail: "Alle getrackten Reels" },
        { label: "Beste Reel", value: topReel ? formatNumber(topReel.views) : "0", detail: topReel ? topReel.title : "Noch keine Daten" },
        { label: "Beste Kategorie", value: bestCategory(), detail: "Nach Gesamtviews" },
        { label: "Ø Likes", value: averageMetric("likes"), detail: "Pro getracktem Reel" },
        { label: "Ø Saves", value: averageMetric("saves"), detail: "Pro getracktem Reel" }
      ];
      els.stats.innerHTML = stats.map((stat) => `
        <article class="stat">
          <strong>${escapeHtml(stat.value)}</strong>
          <span>${escapeHtml(stat.label)}</span>
          <small>${escapeHtml(stat.detail)}</small>
        </article>
      `).join("");
    }

    function countStatus(status) {
      return items.filter((item) => item.status === status).length;
    }

    function sumMetric(metric) {
      return reelStats.reduce((sum, stat) => sum + toNumber(stat[metric]), 0);
    }

    function averageMetric(metric) {
      if (!reelStats.length) return "0";
      return Math.round(sumMetric(metric) / reelStats.length).toString();
    }

    function bestReel() {
      return [...reelStats].sort((a, b) => b.views - a.views)[0];
    }

    function bestCategory() {
      if (!reelStats.length) return "-";
      const totals = reelStats.reduce((map, stat) => {
        map[stat.category] = (map[stat.category] || 0) + toNumber(stat.views);
        return map;
      }, {});
      return Object.entries(totals).sort((a, b) => b[1] - a[1])[0][0];
    }

    function itemCard(item) {
      const article = document.createElement("article");
      article.className = "idea";
      article.innerHTML = `
        <div class="idea-head">
          <h3>${escapeHtml(item.title)}</h3>
          <span class="badge status">${escapeHtml(item.status)}</span>
        </div>
        <div class="meta">
          <span class="badge">${escapeHtml(item.category)}</span>
          <span class="badge">${item.date ? formatDate(item.date) : "Ohne Datum"}</span>
        </div>
        <p class="notes">${escapeHtml(item.notes || "Keine Notizen")}</p>
        <div class="actions">
          <button class="secondary" type="button" data-action="next">Weiter</button>
          <button class="secondary danger" type="button" data-action="delete">Loeschen</button>
        </div>
      `;
      article.querySelector('[data-action="next"]').addEventListener("click", () => advanceStatus(item.id));
      article.querySelector('[data-action="delete"]').addEventListener("click", () => deleteItem(item.id));
      return article;
    }

    function statsCard(stat) {
      const article = document.createElement("article");
      article.className = "idea";
      article.innerHTML = `
        <div class="idea-head">
          <h3>${escapeHtml(stat.title)}</h3>
          <span class="badge status">${formatNumber(stat.views)} Views</span>
        </div>
        <div class="meta">
          <span class="badge">${escapeHtml(stat.category)}</span>
          <span class="badge">${stat.date ? formatDate(stat.date) : "Ohne Datum"}</span>
          <span class="badge">${escapeHtml(stat.song || "Kein Song")}</span>
        </div>
        <p class="notes">${escapeHtml(stat.hook || "Keine Hook notiert")}</p>
        <div class="metric-grid">
          <div class="metric"><strong>${formatNumber(stat.likes)}</strong><span>Likes</span></div>
          <div class="metric"><strong>${formatNumber(stat.comments)}</strong><span>Kommentare</span></div>
          <div class="metric"><strong>${formatNumber(stat.saves)}</strong><span>Saves</span></div>
          <div class="metric"><strong>${formatNumber(stat.shares)}</strong><span>Shares</span></div>
          <div class="metric"><strong>${formatNumber(stat.followers)}</strong><span>Follower</span></div>
        </div>
        <p class="notes">${escapeHtml(stat.note || "Keine Auswertung notiert")}</p>
        <div class="actions">
          <button class="secondary danger" type="button" data-action="deleteStats">Loeschen</button>
        </div>
      `;
      article.querySelector('[data-action="deleteStats"]').addEventListener("click", () => deleteStats(stat.id));
      return article;
    }

    function renderList(container, source, emptyText) {
      container.innerHTML = "";
      if (!source.length) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = emptyText;
        container.appendChild(empty);
        return;
      }
      source.forEach((item) => container.appendChild(itemCard(item)));
    }

    function renderStatsList() {
      els.statsList.innerHTML = "";
      const sorted = sortedByDate(reelStats).reverse();
      if (!sorted.length) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = "Noch keine Reel-Statistik gespeichert.";
        els.statsList.appendChild(empty);
        return;
      }
      sorted.forEach((stat) => els.statsList.appendChild(statsCard(stat)));
    }

    function renderIdeas() {
      const filtered = activeCategory === "Alle"
        ? items
        : items.filter((item) => item.category === activeCategory);
      renderList(els.ideaList, filtered, "Noch keine Idee in dieser Kategorie.");
    }

    function renderPlanner() {
      const filtered = activeStatus === "Alle"
        ? sortedByDate(items)
        : sortedByDate(items.filter((item) => item.status === activeStatus));
      renderList(els.plannerList, filtered, "Keine Reels fuer diesen Status.");
    }

    function renderNextReels() {
      const next = sortedByDate(items)
        .filter((item) => item.status !== "Hochgeladen")
        .slice(0, 3);
      renderList(els.nextReels, next, "Noch nichts geplant.");
    }

    function sortedByDate(source) {
      return [...source].sort((a, b) => (a.date || "9999").localeCompare(b.date || "9999"));
    }

    function advanceStatus(id) {
      items = items.map((item) => {
        if (item.id !== id) return item;
        const index = statuses.indexOf(item.status);
        return { ...item, status: statuses[Math.min(index + 1, statuses.length - 1)] };
      });
      persist();
    }

    function deleteItem(id) {
      items = items.filter((item) => item.id !== id);
      persist();
    }

    function deleteStats(id) {
      reelStats = reelStats.filter((stat) => stat.id !== id);
      persist();
    }

    function formatDate(value) {
      const [year, month, day] = value.split("-");
      return `${day}.${month}.${year}`;
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function toNumber(value) {
      const number = Number(value);
      return Number.isFinite(number) && number > 0 ? Math.round(number) : 0;
    }

    function formatNumber(value) {
      return toNumber(value).toLocaleString("de-DE");
    }

    function render() {
      renderChips(els.filters, categories, activeCategory, (value) => {
        activeCategory = value;
        render();
      });
      renderChips(els.statusFilters, ["Alle", ...statuses], activeStatus, (value) => {
        activeStatus = value;
        render();
      });
      renderStats();
      renderIdeas();
      renderPlanner();
      renderNextReels();
      renderStatsList();
    }

    els.tabs.forEach((tab) => {
      tab.addEventListener("click", () => setView(tab.dataset.view));
    });

    els.form.addEventListener("submit", (event) => {
      event.preventDefault();
      items = [
        {
          id: crypto.randomUUID(),
          title: els.title.value.trim(),
          notes: els.notes.value.trim(),
          category: els.category.value,
          status: els.status.value,
          date: els.date.value,
          createdAt: Date.now()
        },
        ...items
      ];
      els.form.reset();
      persist();
    });

    els.statsForm.addEventListener("submit", (event) => {
      event.preventDefault();
      reelStats = [
        {
          id: crypto.randomUUID(),
          title: els.statsTitle.value.trim(),
          date: els.statsDate.value,
          category: els.statsCategory.value,
          hook: els.statsHook.value.trim(),
          song: els.statsSong.value.trim(),
          views: toNumber(els.statsViews.value),
          likes: toNumber(els.statsLikes.value),
          comments: toNumber(els.statsComments.value),
          saves: toNumber(els.statsSaves.value),
          shares: toNumber(els.statsShares.value),
          followers: toNumber(els.statsFollowers.value),
          note: els.statsNote.value.trim(),
          createdAt: Date.now()
        },
        ...reelStats
      ];
      els.statsForm.reset();
      persist();
    });

    persist();
  </script>
</body>
</html>
